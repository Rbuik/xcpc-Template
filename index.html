<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的算法模板库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>💻 ACM / OI 算法模板库</h1>
        <p>专为个人复习与比赛准备 | C++ 代码风格</p>
    </header>

    <div class="container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <h2>📚 目录分类</h2>
            
            <!-- 左侧全局搜索框 -->
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 全局搜索..." oninput="filterCards()">
            </div>
            
            <ul id="category-list">
                <!-- 由 JS 动态生成 -->
            </ul>
        </aside>

        <!-- 右侧代码区 -->
        <main class="content" id="code-container">
            <div class="welcome">
                <h2>👋 欢迎使用</h2>
                <p>请点击左侧分类查看对应的算法代码及解析。</p>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
