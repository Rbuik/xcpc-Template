<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算法模板库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>💻 ACM / OI 算法模板库</h1>
        <p>专为个人复习与比赛准备 | C++ 代码风格</p>
        
        <!-- 主题选择器 -->
        <div class="theme-selector">
            <label for="theme-select">🎨 主题配色：</label>
            <select id="theme-select" onchange="changeTheme(this.value)">
                <option value="blue">经典蓝</option>
                <option value="green">护眼绿</option>
                <option value="teal">蓝绿色</option>
                <option value="purple">紫罗兰</option>
                <option value="orange">活力橙</option>
                <option value="pink">樱花粉</option>
                <option value="dark">极客黑</option>
            </select>
        </div>
    </header>

    <!-- 字体大小调节面板 -->
    <div class="font-controls">
        <button onclick="changeFontSize(-1)">A-</button>
        <button onclick="changeFontSize(1)">A+</button>
    </div>

    <div class="container">
        <!-- 左侧导航 -->
        <aside class="sidebar">
            <h2>📚 目录分类</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 全局搜索..." oninput="filterCards()">
            </div>
            <ul id="category-list"></ul>
        </aside>

        <!-- 右侧代码区 -->
        <main class="content" id="code-container"></main>
    </div>

    <script src="js/main.js?v=3"></script>
</body>
</html>
